name: React CI/CD Pipeline

on:
  push:
    branches:
      -main
jobs:
  build-and-deploy:
    runs-on:  ubuntu-latest

    steps:
      -name: Checkout Source
        uses: actions/checkout@v4

        -name:Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        
      -name :Install Dependencies
        run: npm install

      -name:Build Project
      run:npm run build

      -name: Build Docker Image
        run: docker build -t ci-cd-learning:latest .

        -name: Success Message
        run : echo "Build Complete Successfully"